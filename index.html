<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitoring APBS Lazuardi</title>
    <script>
      // Guard for window.fetch setter in sandboxed iframe environments
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch property guard init warning:', e);
        }

        // Suppress benign Vite dev server HMR websocket disconnect noise
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (
            (typeof event.reason === 'string' && event.reason.includes('WebSocket')) ||
            (event.reason.message && event.reason.message.includes('WebSocket'))
          )) {
            event.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
